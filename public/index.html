<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📺 STATION 0</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        @font-face {
            font-family: 'TV';
            src: local('Courier New'), local('monospace');
        }

        body {
            background: #0a0a0a;
            color: #e0e0e0;
            font-family: 'TV', monospace;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .tv {
            width: 90vw;
            max-width: 600px;
            aspect-ratio: 4/3;
            background: #111;
            border-radius: 20px;
            padding: 40px;
            position: relative;
            box-shadow:
                0 0 0 8px #222,
                0 0 0 12px #333,
                0 0 60px rgba(255,255,255,0.05);
        }

        .screen {
            width: 100%;
            height: 100%;
            background: #000;
            border-radius: 8px;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .screen::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background:
                repeating-linear-gradient(
                    0deg,
                    rgba(0,0,0,0.1) 0px,
                    rgba(0,0,0,0.1) 1px,
                    transparent 1px,
                    transparent 2px
                );
            pointer-events: none;
            z-index: 10;
        }

        .screen::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: radial-gradient(
                ellipse at center,
                transparent 0%,
                rgba(0,0,0,0.3) 100%
            );
            pointer-events: none;
            z-index: 11;
        }

        .channel {
            font-size: 0.7rem;
            color: #666;
            letter-spacing: 0.3em;
            text-transform: uppercase;
            margin-bottom: 10px;
        }

        .program-name {
            font-size: 1rem;
            color: #fff;
            margin-bottom: 20px;
            text-align: center;
        }

        .content {
            font-size: 0.9rem;
            line-height: 1.8;
            color: #ccc;
            text-align: center;
            max-width: 100%;
            animation: flicker 0.15s infinite;
        }

        @keyframes flicker {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.98; }
        }

        .info {
            position: absolute;
            bottom: 10px;
            right: 15px;
            font-size: 0.6rem;
            color: #333;
        }

        .static {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            opacity: 0.03;
            pointer-events: none;
            z-index: 5;
        }

        .loading {
            color: #444;
            animation: blink 1s infinite;
        }

        @keyframes blink {
            0%, 50% { opacity: 1; }
            51%, 100% { opacity: 0; }
        }

        .power-light {
            position: absolute;
            bottom: 15px;
            left: 50%;
            transform: translateX(-50%);
            width: 8px;
            height: 8px;
            background: #2a2;
            border-radius: 50%;
            box-shadow: 0 0 10px #2a2;
        }
    </style>
</head>
<body>
    <div class="tv">
        <div class="screen">
            <canvas class="static" id="static"></canvas>
            <div class="channel" id="channel">TUNING...</div>
            <div class="program-name" id="program-name">—</div>
            <div class="content" id="content">
                <span class="loading">■</span>
            </div>
            <div class="info" id="info"></div>
        </div>
        <div class="power-light"></div>
    </div>

    <script>
        // Static noise
        const canvas = document.getElementById('static');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = canvas.offsetWidth;
            canvas.height = canvas.offsetHeight;
        }

        function drawStatic() {
            const imageData = ctx.createImageData(canvas.width, canvas.height);
            const data = imageData.data;

            for (let i = 0; i < data.length; i += 4) {
                const value = Math.random() > 0.5 ? 255 : 0;
                data[i] = value;
                data[i + 1] = value;
                data[i + 2] = value;
                data[i + 3] = 255;
            }

            ctx.putImageData(imageData, 0, 0);
            requestAnimationFrame(drawStatic);
        }

        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);
        drawStatic();

        // Load program
        async function loadProgram() {
            try {
                const response = await fetch('/program.json?' + Date.now());
                const program = await response.json();

                document.getElementById('channel').textContent =
                    'CH.' + program.channel.toUpperCase();
                document.getElementById('program-name').textContent =
                    program.name;
                document.getElementById('content').textContent =
                    program.content;
                document.getElementById('info').textContent =
                    'NEXT: ' + program.next_switch;

            } catch (e) {
                document.getElementById('content').innerHTML =
                    '<span class="loading">NO SIGNAL</span>';
            }
        }

        loadProgram();

        // Refresh every minute
        setInterval(loadProgram, 60000);
    </script>
</body>
</html>
